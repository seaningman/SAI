# Tokyo Night palette (https://github.com/folke/tokyonight.nvim, MIT, by folke).
# Every app reads its colours from the active theme's colors.toml via `theme-render`.
name = "Tokyo Night"
mode = "dark"

accent = "#7aa2f7"
selection = "#292e42"
muted = "#414868"

background = "#1a1b26"
dark_background = "#13141c"
darker_background = "#0e0e14"
lighter_background = "#24283b"

foreground = "#a9b1d6"
dark_foreground = "#565f89"
bright_foreground = "#c0caf5"

red = "#f7768e"
yellow = "#e0af68"
orange = "#ff9e64"
green = "#9ece6a"
cyan = "#449dab"
blue = "#7aa2f7"
magenta = "#ad8ee6"

bright_red = "#ff7a93"
bright_green = "#b9f27c"
bright_cyan = "#0db9d7"
bright_blue = "#7da6ff"
bright_magenta = "#bb9af7"

# Layout tokens shared by hyprland and waybar
gaps_in = "5"
gaps_out = "10"
border_size = "2"
rounding = "8"
